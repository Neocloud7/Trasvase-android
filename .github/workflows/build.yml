name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          if [ -f proyecto.zip ]; then unzip -n proyecto.zip -d . ; fi

      - name: Usar la última versión del juego
        run: |
          curl -fsSL -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/Neocloud7/Trasvase/contents/index.html \
            -o app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk trasvase.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trasvase-apk
          path: trasvase.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: Trasvase (prueba ${{ github.run_number }})
          body: Versión de prueba para instalar en Android.
          files: trasvase.apk
          make_latest: true
